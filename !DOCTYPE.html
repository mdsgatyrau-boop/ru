<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraction Type Classifier Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --accent1: #06b6d4;
      --accent2: #8b5cf6;
      --accent3: #facc15;
      --text: #f8fafc;
      --good: #22c55e;
      --bad: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      padding-bottom: 40px;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 20% 30%, rgba(8,146,208,0.3), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(168,85,247,0.3), transparent 60%),
                  radial-gradient(circle at 50% 50%, rgba(250,204,21,0.2), transparent 60%);
      animation: glowMove 10s linear infinite;
      z-index: 0;
      filter: blur(80px);
    }

    @keyframes glowMove {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-10%, -10%) scale(1.2); }
      100% { transform: translate(0, 0) scale(1); }
    }

    header { text-align: center; margin-top: 24px; z-index: 1; }
    h1 { font-size: 2rem; background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; color: transparent; text-shadow: 0 0 15px rgba(139,92,246,0.5); }
    .subtitle { color: #e2e8f0; margin-top: 6px; }

    .panel { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 24px; width: min(1000px,90vw); box-shadow: 0 0 40px rgba(0,0,0,0.6); z-index: 1; }

    .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }

    button, select {
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      color: #0f172a; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: .3s; box-shadow: 0 0 10px rgba(139,92,246,0.5);
    }
    button:hover, select:hover { filter: brightness(1.1) saturate(1.3); transform: scale(1.05); box-shadow: 0 0 20px rgba(250,204,21,0.6); }

    .game { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 800px){ .game { grid-template-columns: 1fr; } }

    .cards { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 14px; }
    .card { background: linear-gradient(180deg,#1e293b,#0f172a); border: 2px solid transparent; border-radius: 16px; padding: 16px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.4); transition: .3s; cursor: grab; }
    .card:hover { border-color: var(--accent3); transform: translateY(-4px) rotateZ(-1deg); box-shadow: 0 0 15px rgba(250,204,21,0.6); }
    .expr { font-size: 1.4rem; font-weight: 700; color: var(--accent3); }

    .zones { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    @media (max-width: 800px){ .zones { grid-template-columns: 1fr; } }
    .zone { background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.3); border-radius: 18px; padding: 16px; min-height: 140px; transition: .3s; }
    .zone:hover { border-color: var(--accent2); background: rgba(139,92,246,0.15); box-shadow: 0 0 15px rgba(139,92,246,0.5); }
    .zone h3 { margin-bottom: 8px; color: var(--accent3); text-shadow: 0 0 8px rgba(250,204,21,0.4); }

    .score { margin-top: 14px; text-align: center; font-weight: 700; font-size: 1.2rem; }

    .toast { position: fixed; bottom: 20px; right: 20px; background: linear-gradient(90deg, var(--accent1), var(--accent2)); color: #0f172a; padding: 12px 18px; border-radius: 12px; font-weight: 600; display: none; box-shadow: 0 0 20px rgba(139,92,246,0.5); animation: pop .4s ease; }
    @keyframes pop { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }

    .timer { text-align: center; font-weight: 700; font-size: 1.2rem; color: var(--accent3); text-shadow: 0 0 10px rgba(250,204,21,0.6); margin-bottom: 10px; }

    /* Confetti */
    .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; z-index: 999; }
    .confetti-piece { position: absolute; width: 10px; height: 10px; background: var(--accent3); opacity: 0.8; animation: fall 3s linear infinite; }
    @keyframes fall {
      0% { transform: translateY(-10%) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(720deg); }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Fraction Type Classifier</h1>
    <p class="subtitle">1️⃣ Same denominators · 2️⃣ Relatively prime · 3️⃣ Common factor</p>
  </header>

  <main class="panel">
    <div class="controls">
      <select id="qty"><option>6</option><option selected>8</option><option>10</option></select>
      <button id="newSet">New Set</button>
      <button id="check">Check Answers</button>
      <button id="reset">Reset</button>
    </div>

    <div class="timer">⏱ Time Left: <span id="timer">60</span> s</div>

    <div class="game">
      <div class="cards" id="cards"></div>
      <div class="zones">
        <div class="zone" data-zone="1"><h3>① Same denominators</h3></div>
        <div class="zone" data-zone="2"><h3>② Relatively prime</h3></div>
        <div class="zone" data-zone="3"><h3>③ Common factor</h3></div>
      </div>
    </div>

    <div class="score" id="score">Score: 0 / 0</div>
  </main>
  <div class="toast" id="toast"></div>
  <div class="confetti" id="confetti"></div>

  <script>
    const BANK=[{a:[2,7],b:[3,7],t:1},{a:[4,9],b:[2,9],t:1},{a:[5,11],b:[3,11],t:1},{a:[1,5],b:[2,5],t:1},{a:[1,3],b:[1,4],t:2},{a:[2,5],b:[1,3],t:2},{a:[1,2],b:[1,3],t:2},{a:[3,4],b:[1,5],t:2},{a:[3,8],b:[5,12],t:3},{a:[2,6],b:[1,9],t:3},{a:[2,10],b:[1,15],t:3},{a:[3,4],b:[1,6],t:3}];

    const cards=document.getElementById('cards');
    const scoreEl=document.getElementById('score');
    const toast=document.getElementById('toast');
    const timerEl=document.getElementById('timer');
    const confetti=document.getElementById('confetti');
    let timer,timeLeft=60;

    const state={cards:[],placed:{},score:0};

    function shuffle(a){return a.sort(()=>Math.random()-.5)}

    function newSet(){
      const qty=parseInt(document.getElementById('qty').value);
      state.cards=shuffle([...BANK]).slice(0,qty);
      cards.innerHTML='';
      state.cards.forEach((p,i)=>{
        const c=document.createElement('div');
        c.className='card'; c.draggable=true; c.id='card'+i; c.dataset.type=p.t;
        c.innerHTML=`<div class='expr'>${p.a[0]}/${p.a[1]} + ${p.b[0]}/${p.b[1]}</div>`;
        cards.appendChild(c);
        c.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',c.id));
      });
      document.querySelectorAll('.zone').forEach(z=>z.innerHTML='<h3>'+z.querySelector('h3').textContent+'</h3>');
      state.placed={}; state.score=0; updateScore(); startTimer(); showToast('✨ New set ready!');
    }

    document.querySelectorAll('.zone').forEach(zone=>{
      zone.addEventListener('dragover',e=>e.preventDefault());
      zone.addEventListener('drop',e=>{
        e.preventDefault();
        const id=e.dataTransfer.getData('text/plain');
        const card=document.getElementById(id);
        zone.appendChild(card);
        state.placed[id]=parseInt(zone.dataset.zone);
      });
    });

    function check(){
      let correct=0;
      state.cards.forEach((p,i)=>{if(state.placed['card'+i]===p.t)correct++;});
      state.score=correct; updateScore();
      showToast('🎯 '+correct+' correct answers!');
      if(correct===state.cards.length){ triggerConfetti(); showToast('🎉 Perfect score!'); }
    }

    function reset(){newSet();}
    function updateScore(){scoreEl.textContent='Score: '+state.score+' / '+state.cards.length;}
    function showToast(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',2000);}

    function startTimer(){
      clearInterval(timer); timeLeft=60; timerEl.textContent=timeLeft;
      timer=setInterval(()=>{
        timeLeft--; timerEl.textContent=timeLeft;
        if(timeLeft<=0){ clearInterval(timer); check(); showToast('⏰ Time is up!'); }
      },1000);
    }

    function triggerConfetti(){
      confetti.innerHTML='';
      for(let i=0;i<80;i++){
        const div=document.createElement('div');
        div.className='confetti-piece';
        div.style.left=Math.random()*100+'%';
        div.style.background=['#06b6d4','#8b5cf6','#facc15','#22c55e'][Math.floor(Math.random()*4)];
        div.style.animationDuration=(2+Math.random()*3)+'s';
        div.style.width=div.style.height=(6+Math.random()*6)+'px';
        confetti.appendChild(div);
        setTimeout(()=>div.remove(),3000);
      }
    }

    document.getElementById('newSet').onclick=newSet;
    document.getElementById('check').onclick=check;
    document.getElementById('reset').onclick=reset;
    newSet();
  </script>
</body>
</html>
